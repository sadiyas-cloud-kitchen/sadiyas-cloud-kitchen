<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sadiya's Cloud Kitchen | Order Online</title>

<meta name="description" content="Order fresh home-style food in Ranchi. Kababs, Meals & Desserts. WhatsApp ordering available.">

<!-- SOCIAL PREVIEW -->
<meta property="og:title" content="Sadiya's Cloud Kitchen 🍲">
<meta property="og:description" content="Delicious home-style food delivered in Ranchi">
<meta property="og:image" content="https://sadiyas-cloud-kitchen.github.io/sadiyas-cloud-kitchen/assets/hero-biryani.png">
<meta property="og:url" content="https://sadiyas-cloud-kitchen.github.io/sadiyas-cloud-kitchen/">

<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- HERO -->
<section class="hero">
  <img src="assets/hero-biryani.png">
  <div class="hero-text">
    <h1>Sadiya’s Cloud Kitchen</h1>
    <p>Fresh • Hygienic • Home Style Food</p>
  </div>
</section>

<!-- CATEGORY -->
<div class="categories">
  <button onclick="filterMenu('all')">All</button>
  <button onclick="filterMenu('kabab')">Kababs</button>
  <button onclick="filterMenu('dessert')">Desserts</button>
  <button onclick="filterMenu('combo')">Combos</button>
</div>

<!-- MENU -->
<section class="menu">

<div class="item kabab">
<img src="assets/chicken-kabab.png">
<h3>Chicken Kabab</h3>
<span>₹220</span>
<button onclick="addToCart('Chicken Kabab',220)">Add</button>
</div>

<div class="item kabab">
<img src="assets/nonveg-meal.png">
<h3>Non-Veg Meal</h3>
<span>₹280</span>
<button onclick="addToCart('Non-Veg Meal',280)">Add</button>
</div>

<div class="item dessert">
<img src="assets/gajar-halwa.png">
<h3>Gajar Halwa</h3>
<span>₹120</span>
<button onclick="addToCart('Gajar Halwa',120)">Add</button>
</div>

<div class="item dessert">
<img src="assets/apricot-pudding.png">
<h3>Apricot Pudding</h3>
<span>₹150</span>
<button onclick="addToCart('Apricot Pudding',150)">Add</button>
</div>

<div class="item combo">
<h3>Family Combo</h3>
<p>Full Meal + Dessert</p>
<span>₹499</span>
<button onclick="addToCart('Family Combo',499)">Add</button>
</div>

</section>

<!-- WHY -->
<section class="content">
<h2>Why Choose Us?</h2>
<p>✔ Fresh Cooking ✔ Hygienic ✔ Home Taste</p>
</section>

<!-- CART -->
<div class="cart">🛒 <span id="cart">0</span></div>

<!-- ORDER -->
<div class="order-bar">
<button onclick="sendCart()">Order on WhatsApp</button>
</div>

<script src="script.js"></script>
</body>
</html>
